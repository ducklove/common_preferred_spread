<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<!-- build: sqrt-spread-index -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우선주 괴리율 대시보드</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=1">
<script>
// iframe embed + theme: ?theme=dark|light overrides stored theme; ?embed hides chrome.
(function() {
  try {
    var params = new URLSearchParams(location.search);
    var urlTheme = params.get('theme');
    var stored = localStorage.getItem('theme') || localStorage.getItem('preferred-theme');
    var theme = (urlTheme === 'dark' || urlTheme === 'light') ? urlTheme : (stored || 'light');
    document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    var embed = params.get('embed');
    if (embed !== null && embed !== '0' && embed !== 'false') {
      document.documentElement.dataset.embed = '1';
    }
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1>우선주 괴리율 대시보드</h1>
      <div class="updated" id="lastUpdated"></div>
    </div>
    <div class="header-actions">
      <button type="button" class="refresh-btn" id="refreshBtn">새로고침</button>
      <button type="button" class="theme-toggle" id="themeToggle" title="테마 전환" aria-label="테마 전환">🌓</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="today-overview" id="todayOverview"></div>
  <div class="card-toolbar">
    <div class="card-toolbar-title">카드 정렬</div>
    <div class="card-sort-options" id="cardSortOptions" aria-label="카드 정렬">
      <button type="button" data-card-sort="spread" class="active">괴리율</button>
      <button type="button" data-card-sort="preferredYield">배당수익률</button>
      <button type="button" data-card-sort="spreadWidening">일 확대</button>
      <button type="button" data-card-sort="spreadNarrowing">일 축소</button>
    </div>
  </div>
  <div class="cards" id="cards"></div>

  <div class="heatmap-section" id="heatmapSection">
    <div class="heatmap-header">
      <div>
        <div class="heatmap-title">괴리율 히트맵</div>
        <div class="heatmap-subtitle">색 = 현재 괴리율의 역사적 위치(z-score) · 면적 = 우선주 시총(√)</div>
      </div>
      <div class="heatmap-actions">
        <div class="heatmap-legend" id="heatmapLegend"></div>
        <button type="button" class="zoom-reset-btn" id="heatmapToggleBtn">접기</button>
      </div>
    </div>
    <div class="heatmap-body" id="heatmapBody">
      <div class="heatmap-treemap" id="heatmapTreemap"></div>
    </div>
  </div>

  <div class="chart-section" id="spreadChartSection">
    <div class="chart-header">
      <div class="chart-title" id="chartTitle">삼성전자 괴리율 추이</div>
      <div class="period-btns" id="periodBtns">
        <button data-days="30">1M</button>
        <button data-days="90">3M</button>
        <button data-days="180">6M</button>
        <button data-days="365">1Y</button>
        <button data-days="0" class="active">전체</button>
      </div>
      <button type="button" class="zoom-reset-btn" id="csvExportBtn">CSV</button>
    </div>
    <div class="chart-container">
      <canvas id="chart"></canvas>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <div class="zoom-panel" id="zoomPanel">
      <div class="zoom-head">
        <div class="zoom-title">범위 확대</div>
        <div class="zoom-range-label" id="zoomRangeLabel"></div>
        <button type="button" class="zoom-reset-btn" id="zoomResetBtn">전체 보기</button>
      </div>
      <div class="zoom-overview">
        <canvas id="zoomChart"></canvas>
        <div class="zoom-selection" id="zoomSelection"></div>
        <input type="range" min="0" max="1000" value="0" class="zoom-slider zoom-slider-start" id="zoomStart" aria-label="시작 범위">
        <input type="range" min="0" max="1000" value="1000" class="zoom-slider zoom-slider-end" id="zoomEnd" aria-label="끝 범위">
      </div>
    </div>
    <div class="price-chart-container">
      <div class="price-chart-title" id="priceChartTitle">시세 추이</div>
      <div class="price-legend" id="priceLegend"></div>
      <canvas id="priceChart"></canvas>
      <div class="tooltip" id="priceTooltip"></div>
    </div>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="table-section">
    <h2>종목 비교</h2>
    <table>
      <thead>
        <tr>
          <th>종목</th>
          <th class="numeric">보통주</th>
          <th class="numeric">우선주</th>
          <th class="numeric">보통주 시총</th>
          <th class="numeric">우선주 시총</th>
          <th class="numeric">우선주 비율</th>
          <th class="numeric">변동</th>
          <th class="numeric" style="min-width:120px">괴리율</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="chart-section strategy-section" id="strategySection">
    <div class="chart-header">
      <div>
        <div class="chart-title">전략 분석 (백테스트)</div>
        <div class="strategy-subtitle">괴리율 상위 3종 순환 전략 vs KOSPI · 오프라인 백테스트 결과</div>
      </div>
      <button type="button" class="zoom-reset-btn" id="strategyToggleBtn">접기</button>
    </div>
    <div class="strategy-body" id="strategyBody">
      <div class="stats-row" id="strategyStats"></div>
      <div class="strategy-chart-container">
        <canvas id="strategyChart"></canvas>
        <div class="tooltip" id="strategyTooltip"></div>
      </div>
      <div class="strategy-tables" id="strategyTables"></div>
      <div class="strategy-note" id="strategyNote"></div>
    </div>
  </div>
</div>

<div class="index-modal-backdrop" id="indexWeightModal" hidden>
  <div class="index-modal-panel" role="dialog" aria-modal="true" aria-labelledby="indexWeightModalTitle">
    <div class="index-modal-header">
      <div>
        <div class="index-modal-kicker">괴리율 지수</div>
        <h2 class="index-modal-title" id="indexWeightModalTitle">종목별 비중</h2>
      </div>
      <button type="button" class="index-modal-close" id="indexWeightModalClose" aria-label="닫기">×</button>
    </div>
    <div class="index-modal-body">
      <div class="index-modal-summary" id="indexWeightSummary"></div>
      <div class="index-modal-note" id="indexWeightNote"></div>
      <div class="index-weight-table-wrap">
        <table class="index-weight-table">
          <thead>
            <tr>
              <th>종목</th>
              <th>비중</th>
              <th>우선주총액</th>
              <th>괴리율</th>
              <th>전일비</th>
            </tr>
          </thead>
          <tbody id="indexWeightTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
