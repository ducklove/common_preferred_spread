name: Update Stock Data (Daily)

on:
  schedule:
    # 매일 한국시간 오전 5시 13분 (UTC 20:13) - 장마감 후 일일 데이터 갱신 (정각 드랍 회피 오프셋)
    - cron: "13 20 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: '전체 데이터 다시 다운로드'
        required: false
        type: boolean
        default: false
      proxy_backfill:
        description: '프록시 백필 pair id 목록 (공백 구분, 예: samsung_elec cj_4pref)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write  # 실패 이슈 알림 (fin-commons 표준 헬스 패턴)

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backup previous data
        uses: actions/upload-artifact@v7
        with:
          name: data-backup-${{ github.run_id }}
          path: |
            data.js
            proxy_backfill_progress.json
          retention-days: 90
          if-no-files-found: warn

      - name: Fetch latest data
        env:
          PROXY_HISTORY_BASE_URL: ${{ vars.PROXY_HISTORY_BASE_URL }}
          INTERNAL_PRICE_API: ${{ vars.INTERNAL_PRICE_API }}
          INTERNAL_PRICE_API_BASE_URL: ${{ vars.INTERNAL_PRICE_API_BASE_URL }}
          INTERNAL_DAILY_API_URL: ${{ vars.INTERNAL_DAILY_API_URL }}
          INTERNAL_CLOSE_API_URL: ${{ vars.INTERNAL_CLOSE_API_URL }}
          INTERNAL_INDICES_API_URL: ${{ vars.INTERNAL_INDICES_API_URL }}
          INTERNAL_DIVIDENDS_API_URL: ${{ vars.INTERNAL_DIVIDENDS_API_URL }}
        run: >
          python fetch_data.py
          ${{ inputs.full && '--full' || '' }}
          ${{ inputs.proxy_backfill && format('--proxy-backfill {0}', inputs.proxy_backfill) || '' }}
          --auto-proxy-backfill-batch-size 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data proxy_backfill_progress.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "시세 데이터 갱신 ($(TZ='Asia/Seoul' date +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          git push

      # --- fin-commons 표준 파이프라인 헬스 블록 ---------------------------
      # ① 실패 → GitHub 이슈 (시크릿 불필요, pip install 실패 시에도 동작)
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create data-update-failure --color D93F0B \
            --description "데이터 갱신 워크플로우 실패" --force || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="${{ github.workflow }} 워크플로우가 실패했습니다. 실행 로그: ${run_url}"
          existing=$(gh issue list --label data-update-failure --state open \
            --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "데이터 갱신 실패: ${{ github.workflow }}" \
              --label data-update-failure --body "$body"
          fi

      # ② 실패 → Telegram/Discord (리포 시크릿이 설정된 경우에만 발송, 없으면 조용히 skip)
      - name: Failure alert (fin-commons)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >
          python -m fin_commons.notify_cli
          --context "${{ github.repository }} / ${{ github.workflow }}"
          --detail "일별 시세 데이터 갱신 실패"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          || true
