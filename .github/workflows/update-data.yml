name: Update Stock Data (Daily)

on:
  schedule:
    # 매일 한국시간 오전 5시 13분 (UTC 20:13) - 장마감 후 일일 데이터 갱신 (정각 드랍 회피 오프셋)
    - cron: "13 20 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: '전체 데이터 다시 다운로드'
        required: false
        type: boolean
        default: false
      proxy_backfill:
        description: '프록시 백필 pair id 목록 (공백 구분, 예: samsung_elec cj_4pref)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backup previous data
        uses: actions/upload-artifact@v7
        with:
          name: data-backup-${{ github.run_id }}
          path: |
            data.js
            proxy_backfill_progress.json
          retention-days: 90
          if-no-files-found: warn

      - name: Fetch latest data
        env:
          PROXY_HISTORY_BASE_URL: ${{ vars.PROXY_HISTORY_BASE_URL }}
          INTERNAL_PRICE_API: ${{ vars.INTERNAL_PRICE_API }}
          INTERNAL_PRICE_API_BASE_URL: ${{ vars.INTERNAL_PRICE_API_BASE_URL }}
          INTERNAL_DAILY_API_URL: ${{ vars.INTERNAL_DAILY_API_URL }}
          INTERNAL_CLOSE_API_URL: ${{ vars.INTERNAL_CLOSE_API_URL }}
          INTERNAL_INDICES_API_URL: ${{ vars.INTERNAL_INDICES_API_URL }}
          INTERNAL_DIVIDENDS_API_URL: ${{ vars.INTERNAL_DIVIDENDS_API_URL }}
        run: >
          python fetch_data.py
          ${{ inputs.full && '--full' || '' }}
          ${{ inputs.proxy_backfill && format('--proxy-backfill {0}', inputs.proxy_backfill) || '' }}
          --auto-proxy-backfill-batch-size 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data proxy_backfill_progress.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "시세 데이터 갱신 ($(TZ='Asia/Seoul' date +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          git push
