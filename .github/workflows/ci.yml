name: CI

on:
  pull_request:
  push:
    branches: [master]
    # 봇 데이터 커밋(30분 간격 현재가, 일별 시세)에는 CI를 돌리지 않는다
    paths-ignore:
      - 'current.json'
      - 'data.js'
      - 'data/**'
      - 'proxy_backfill_progress.json'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }

      - name: Python syntax
        run: python -m py_compile fetch_data.py fetch_current.py data_writer.py history_rules.py

      - name: Unit tests
        run: |
          # fin-commons: history_rules/data_writer가 재수출하는 공통 유틸리티
          pip install pytest "fin-commons @ git+https://github.com/ducklove/fin-commons.git@v0.2.0"
          python -m pytest -q

      - name: Ruff lint
        run: |
          pip install ruff==0.15.16
          ruff check .

      # ubuntu-latest 러너에 기본 설치된 node 사용 (setup-node 불필요)
      - name: Frontend syntax (node --check)
        run: |
          # 1) index.html 인라인 <script> (테마 부트스트랩) 구문 검사
          python3 - <<'EOF'
          import re
          html = open('index.html', encoding='utf-8').read()
          for i, s in enumerate(re.findall(r'<script>(.*?)</script>', html, re.S)):
              open(f'/tmp/ci_script_{i}.js', 'w', encoding='utf-8').write(s)
          EOF
          for f in /tmp/ci_script_*.js; do [ -e "$f" ] || continue; node --check "$f"; done
          # 2) js/*.js ES 모듈 구문 검사 — node --check는 .js의 import/export를
          #    러너 node 버전에 따라 거부할 수 있어 .mjs로 복사해 검사한다 (로컬 검증됨)
          tmpdir=$(mktemp -d)
          for f in js/*.js; do
            mjs="$tmpdir/$(basename "${f%.js}").mjs"
            cp "$f" "$mjs"
            node --check "$mjs"
          done
          rm -rf "$tmpdir"

      # jsdom 등 프론트 테스트 devDependencies 설치 (package-lock.json 기준 재현 설치)
      - name: Install frontend test dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npx --yes eslint@9.39.4 --config eslint.config.mjs "js/**/*.js" "tests/js/**/*.mjs" "tests/js/**/*.js"

      - name: Frontend unit tests (node --test)
        run: node --test tests/js/
