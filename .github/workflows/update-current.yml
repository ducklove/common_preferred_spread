name: Update Current Prices

on:
  schedule:
    # 장중 30분 간격 + 16시/21시대 추가 갱신 (한국시간 월~금)
    # 정각(:00/:30) 크론은 GitHub 경합으로 자주 드랍되어 :03/:33으로 오프셋
    - cron: "3,33 0-6 * * 1-5"
    - cron: "3 7 * * 1-5"
    - cron: "3,33 12-20 * * 1-5"
    - cron: "3 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # 실패 이슈 알림 (fin-commons 표준 헬스 패턴)

# 일별 워크플로우와 그룹을 분리해 일별 작업이 대기열에서 밀려 취소되는 것을 방지.
# 두 워크플로우 간 push 경합은 커밋 스텝의 rebase 재시도로 처리한다.
concurrency:
  group: current-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-current.txt

      - name: Fetch current prices
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_AUTH_CACHE_PATH: ${{ runner.temp }}/kis_auth_cache.json
        run: python fetch_current.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "현재가 갱신 ($(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M'))"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          git push

      # --- fin-commons 표준 파이프라인 헬스 블록 ---------------------------
      # 30분 주기라 이슈는 1개에 코멘트로 누적된다 (스팸 방지, gold_gap 검증 패턴).
      # ① 실패 → GitHub 이슈 (시크릿 불필요, pip install 실패 시에도 동작)
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create data-update-failure --color D93F0B \
            --description "데이터 갱신 워크플로우 실패" --force || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="${{ github.workflow }} 워크플로우가 실패했습니다. 실행 로그: ${run_url}"
          existing=$(gh issue list --label data-update-failure --state open \
            --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "데이터 갱신 실패: ${{ github.workflow }}" \
              --label data-update-failure --body "$body"
          fi

      # ② 실패 → Telegram/Discord (리포 시크릿이 설정된 경우에만 발송, 없으면 조용히 skip)
      - name: Failure alert (fin-commons)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >
          python -m fin_commons.notify_cli
          --context "${{ github.repository }} / ${{ github.workflow }}"
          --detail "장중 현재가 갱신 실패"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          || true
