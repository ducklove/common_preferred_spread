name: Update Current Prices

on:
  schedule:
    # 장중 30분 간격 + 16시/21시대 추가 갱신 (한국시간 월~금)
    # 정각(:00/:30) 크론은 GitHub 경합으로 자주 드랍되어 :03/:33으로 오프셋
    - cron: "3,33 0-6 * * 1-5"
    - cron: "3 7 * * 1-5"
    - cron: "3,33 12-20 * * 1-5"
    - cron: "3 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# 일별 워크플로우와 그룹을 분리해 일별 작업이 대기열에서 밀려 취소되는 것을 방지.
# 두 워크플로우 간 push 경합은 커밋 스텝의 rebase 재시도로 처리한다.
concurrency:
  group: current-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-current.txt

      - name: Fetch current prices
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_AUTH_CACHE_PATH: ${{ runner.temp }}/kis_auth_cache.json
        run: python fetch_current.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "현재가 갱신 ($(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M'))"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          git push
